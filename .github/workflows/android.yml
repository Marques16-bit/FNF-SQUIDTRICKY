name: Build Android

on:
  workflow_dispatch:  
  
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r21e
          
      - name: Instalar libs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.3.3
          haxelib install hscript 2.4.0
          haxelib install actuate
          haxelib install newgrounds
          haxelib install polymod 1.5.2
          haxelib run lime setup -alias -y
          haxelib list

      - name: Configurar Lime para Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Compilar APK
        run: haxelib run lime build android -final

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
